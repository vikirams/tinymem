name: Cloudflare model access (fake HTTP)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: integrations/cloudflare/package-lock.json
      - run: cargo build --locked -p tinymem-engine
      - run: npm ci --ignore-scripts
        working-directory: integrations/cloudflare
      - run: npm test
        working-directory: integrations/cloudflare
