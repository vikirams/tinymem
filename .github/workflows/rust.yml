name: Native memory

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  adapters:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TINYMEM_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: cargo build --locked -p tinymem-engine
      - run: python -m pip install ./sdks/python mypy ruff
      - run: python -m unittest discover -s sdks/python/tests -v
      - run: mypy
        working-directory: sdks/python
      - run: ruff check tinymem_native
        working-directory: sdks/python
      - run: python -m compileall -q sdks/python/tinymem_native sdks/python/tests
      - run: python -m pip wheel --no-deps --wheel-dir dist .
        working-directory: sdks/python
      - run: python -I tests/verify_package.py dist/tinymem_native-0.1.0-py3-none-any.whl
        working-directory: sdks/python
      - run: npm ci
        working-directory: sdks/typescript
      - run: npm run typecheck
        working-directory: sdks/typescript
      - run: npm test
        working-directory: sdks/typescript
      - run: npm run build
        working-directory: sdks/typescript
      - run: node tests/verify-package.mjs
        working-directory: sdks/typescript

  pi-local:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TINYMEM_REQUIRE_PI: "1"
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: cargo build --locked -p tinymem-engine
      - run: npm install --global @earendil-works/pi-coding-agent@1.0.0
      - run: python -m unittest tests.test_setup_pi -v
      - run: npm test
      - run: npm run test:pi
      - run: python scripts/smoke-pi-mcp.py
      - run: python scripts/benchmark-local.py --binary target/debug/tinymem --samples 2 --memories 4 --files 2 --output pi-latency-fixture.json
