[package]
name = "tinymem-engine"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Local-first agent memory and incremental repository context"
readme = "../../docs/RUST_ENGINE.md"

[lib]
name = "tinymem_engine"

[[bin]]
name = "tinymem"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
globset = "0.4"
ignore = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-python = "0.25"

[dev-dependencies]
tempfile = "3"
