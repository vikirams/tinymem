[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinymem-native"
version = "0.1.0"
description = "Dependency-free Python SDK for the native tinymem stdio MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["tinymem_native"]

[tool.setuptools.package-data]
tinymem_native = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["tinymem_native", "tests/typecheck_usage.py"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
