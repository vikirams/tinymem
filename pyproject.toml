[project]
name = "tinymem"
version = "0.2.0-dev"
description = "Local memory with one MCP server for every coding agent"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = []

[project.scripts]
tinymem = "tinymem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinymem"]
